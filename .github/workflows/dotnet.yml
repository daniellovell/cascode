name: dotnet-ci

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'build/**'
  pull_request:
    paths-ignore:
      - 'build/**'

env:
  NGSPICE_VERSION: '45.2'

jobs:
  build_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dotnet: ['10.0.103']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Install ngspice build deps (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          bison flex autoconf automake libtool
          libreadline-dev libx11-dev libxaw7-dev

      - name: Build & install ngspice (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -L -o ngspice.tar.gz 'https://sourceforge.net/projects/ngspice/files/ng-spice-rework/${{ env.NGSPICE_VERSION }}/ngspice-${{ env.NGSPICE_VERSION }}.tar.gz/download'
          tar xzf ngspice.tar.gz
          cd ngspice-${{ env.NGSPICE_VERSION }}
          sudo ./compile_linux.sh

      - name: Install ngspice (macOS)
        if: runner.os == 'macOS'
        # brew does not support versioning and only keeps the latest version.
        run: brew install ngspice

      - name: Install ngspice (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -L -o ngspice.7z 'https://sourceforge.net/projects/ngspice/files/ng-spice-rework/${{ env.NGSPICE_VERSION }}/ngspice-${{ env.NGSPICE_VERSION }}_64.7z/download'
          7z x ngspice.7z -oC:\ngspice
          echo "C:\ngspice\Spice64\bin" >> $env:GITHUB_PATH

      - name: Verify ngspice installation
        run: ngspice --version

      - name: Restore (locked)
        run: dotnet restore Cascode.sln --locked-mode

      - name: Clean (Release)
        run: dotnet clean Cascode.sln --configuration Release

      - name: Build CLI (Release)
        run: dotnet build tools/cli/Cascode.Cli.csproj --configuration Release --nologo --no-restore

      - name: Build (Release)
        run: dotnet build Cascode.sln --configuration Release --nologo --no-restore

      - name: Restore Tools
        run: dotnet tool restore

      - name: Format Check
        run: dotnet csharpier check .

      - name: Test with Coverage
        shell: bash -el {0}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            dotnet test Cascode.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage" --filter "Category!=Simulation"
          else
            dotnet test Cascode.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage"
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml

  native_node_test:
    name: native node test (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: Cascode.Native.so
          - os: macos-15-intel
            rid: osx-x64
            lib_name: Cascode.Native.dylib
          - os: macos-15
            rid: osx-arm64
            lib_name: Cascode.Native.dylib
          - os: windows-latest
            rid: win-x64
            lib_name: Cascode.Native.dll
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.103'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            editors/node/package-lock.json

      - name: Publish Cascode.Native
        run: >
          dotnet publish tools/native/Cascode.Native/Cascode.Native.csproj
          --configuration Release
          -r ${{ matrix.rid }}
          -p:PublishAot=true
          -p:EnableAotAnalyzer=false
          -p:EnableTrimAnalyzer=false
          -p:NoWarn=IL2026%3BIL3050%3BCS3021
          -o build/native/${{ matrix.rid }}

      - name: Install node deps
        run: npm install --omit=optional
        working-directory: editors/node

      - name: Build node addon
        run: npm run build
        working-directory: editors/node

      - name: Test node package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export CASCODE_NATIVE_LIB="$GITHUB_WORKSPACE/build/native/${{ matrix.rid }}/${{ matrix.lib_name }}"
          npm test
        working-directory: editors/node

      - name: Test node package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CASCODE_NATIVE_LIB = "$env:GITHUB_WORKSPACE\build\native\${{ matrix.rid }}\${{ matrix.lib_name }}"
          npm test
        working-directory: editors/node
