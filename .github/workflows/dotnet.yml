name: dotnet-ci

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'build/**'
  pull_request:
    paths-ignore:
      - 'build/**'

jobs:
  build_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
        dotnet: ['8.0.x']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: tests/simulation/environment.yml
          environment-name: cascode-sim
          cache-environment: true

      - name: Verify ngspice installation
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: ngspice --version

      - name: Restore (locked)
        run: dotnet restore Cascode.sln --locked-mode

      - name: Build (Release)
        run: dotnet build Cascode.sln --configuration Release --nologo --no-restore

      - name: Format Check
        run: dotnet format --verify-no-changes

      - name: Test with Coverage
        shell: bash -el {0}
        run: dotnet test Cascode.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
