name: dotnet-ci

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'build/**'
  pull_request:
    paths-ignore:
      - 'build/**'

jobs:
  build_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dotnet: ['10.0.103']
    runs-on: ${{ matrix.os }}
    env:
      CASCODE_HOME: ${{ github.workspace }}/.cascode-home-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore (locked)
        run: dotnet restore Cascode.sln --locked-mode

      - name: Clean (Release)
        run: dotnet clean Cascode.sln --configuration Release

      - name: Build CLI (Release)
        run: dotnet build tools/cli/Cascode.Cli.csproj --configuration Release --nologo --no-restore

      - name: Install ngspice build deps (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          bison flex autoconf automake libtool make gcc curl tar

      - name: Install ngspice build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install bison flex autoconf automake libtool

      - name: Install ngspice via CLI (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          install_log="$(mktemp)"
          set +e
          ./tools/cli/bin/Release/net10.0/Cascode.Cli install ngspice --from-source --json >"$install_log" 2>&1
          install_exit=$?
          set -e

          cat "$install_log"
          if [ "$install_exit" -ne 0 ]; then
            exit "$install_exit"
          fi

          install_path="$(python3 -c 'import json,sys; p=json.load(sys.stdin); ip=p.get(\"InstallPath\"); ok=bool(p.get(\"Success\")) and bool(ip); ok or print(p.get(\"Message\", \"ngspice installation failed\"), file=sys.stderr); print(ip if ok else \"\", end=\"\"); sys.exit(0 if ok else 1)' < "$install_log")"
          echo "$(dirname "$install_path")" >> "$GITHUB_PATH"

      - name: Install ngspice via CLI (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $jsonOutput = & .\tools\cli\bin\Release\net10.0\Cascode.Cli.exe install ngspice --from-source --json
          Write-Host $jsonOutput
          $result = $jsonOutput | ConvertFrom-Json
          if (-not $result.Success -or [string]::IsNullOrWhiteSpace($result.InstallPath)) {
            $message = if ([string]::IsNullOrWhiteSpace($result.Message)) { "ngspice installation failed" } else { $result.Message }
            throw $message
          }

          $binDir = Split-Path -Parent $result.InstallPath
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Verify ngspice installation
        run: ngspice --version

      - name: Build (Release)
        run: dotnet build Cascode.sln --configuration Release --nologo --no-restore

      - name: Restore Tools
        run: dotnet tool restore

      - name: Format Check
        run: dotnet csharpier check .

      - name: Test with Coverage
        shell: bash -el {0}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            dotnet test Cascode.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage" --filter "Category!=Simulation"
          else
            dotnet test Cascode.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage"
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml

  native_node_test:
    name: native node test (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: Cascode.Native.so
          - os: macos-15-intel
            rid: osx-x64
            lib_name: Cascode.Native.dylib
          - os: macos-15
            rid: osx-arm64
            lib_name: Cascode.Native.dylib
          - os: windows-latest
            rid: win-x64
            lib_name: Cascode.Native.dll
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.103'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            editors/node/package-lock.json

      - name: Publish Cascode.Native
        run: >
          dotnet publish tools/native/Cascode.Native/Cascode.Native.csproj
          --configuration Release
          -r ${{ matrix.rid }}
          -p:PublishAot=true
          -p:EnableAotAnalyzer=false
          -p:EnableTrimAnalyzer=false
          -p:NoWarn=IL2026%3BIL3050%3BCS3021
          -o build/native/${{ matrix.rid }}

      - name: Install node deps
        run: npm install --omit=optional
        working-directory: editors/node

      - name: Build node addon
        run: npm run build
        working-directory: editors/node

      - name: Test node package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export CASCODE_NATIVE_LIB="$GITHUB_WORKSPACE/build/native/${{ matrix.rid }}/${{ matrix.lib_name }}"
          npm test
        working-directory: editors/node

      - name: Test node package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CASCODE_NATIVE_LIB = "$env:GITHUB_WORKSPACE\build\native\${{ matrix.rid }}\${{ matrix.lib_name }}"
          npm test
        working-directory: editors/node
