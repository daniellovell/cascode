name: dotnet-ci

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'build/**'
  pull_request:
    paths-ignore:
      - 'build/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native_node_path_filter:
    name: determine native/node changes
    runs-on: ubuntu-latest
    outputs:
      run_native_node: ${{ steps.filter.outputs.native_node }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect native/node-relevant paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native_node:
              - '.github/workflows/dotnet.yml'
              - 'Directory.Build.props'
              - 'Cascode.sln'
              - 'tools/native/**'
              - 'tools/language/**'
              - 'tools/render/**'
              - 'tools/workspace/**'
              - 'tools/bench/**'
              - 'editors/node/**'
              - 'lib/std/**'
              - '**/packages.lock.json'

  build_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dotnet: ['10.0.103']
    runs-on: ${{ matrix.os }}
    env:
      CASCODE_HOME: ${{ github.workspace }}/.cascode-home-ci
      DOTNET_TFM: net10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore (locked)
        run: dotnet restore Cascode.sln --locked-mode

      - name: Clean (Release)
        run: dotnet clean Cascode.sln --configuration Release

      - name: Build CLI (Release)
        run: dotnet build tools/cli/Cascode.Cli.csproj --configuration Release --nologo --no-restore

      - name: Install ngspice build deps (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          bison flex autoconf automake libtool make gcc curl tar

      - name: Install ngspice build deps (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install bison flex autoconf automake libtool coreutils gnu-sed findutils gawk

          {
            echo "$(brew --prefix bison)/bin"
            echo "$(brew --prefix flex)/bin"
            echo "$(brew --prefix autoconf)/bin"
            echo "$(brew --prefix automake)/bin"
            echo "$(brew --prefix libtool)/bin"
            echo "$(brew --prefix coreutils)/libexec/gnubin"
            echo "$(brew --prefix gnu-sed)/libexec/gnubin"
            echo "$(brew --prefix findutils)/libexec/gnubin"
            echo "$(brew --prefix gawk)/libexec/gnubin"
          } >> "$GITHUB_PATH"

          gnu_shims="$RUNNER_TEMP/cascode-gnu-shims"
          mkdir -p "$gnu_shims"
          ln -sf "$(command -v aclocal)" "$gnu_shims/aclocal-1.16"
          ln -sf "$(command -v automake)" "$gnu_shims/automake-1.16"
          echo "$gnu_shims" >> "$GITHUB_PATH"

      - name: Install ngspice via CLI (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          install_log="$(mktemp)"
          set +e
          ./tools/cli/bin/Release/${{ env.DOTNET_TFM }}/Cascode.Cli install ngspice --from-source --json >"$install_log" 2>&1
          install_exit=$?
          set -e

          cat "$install_log"
          if [ "$install_exit" -ne 0 ]; then
            exit "$install_exit"
          fi

          install_path="$(
            python3 - "$install_log" <<'PY'
          import json
          import pathlib
          import sys

          log_path = pathlib.Path(sys.argv[1])
          line = next((line for line in reversed(log_path.read_text(encoding="utf-8").splitlines()) if line.strip()), "")

          try:
              payload = json.loads(line)
          except json.JSONDecodeError as ex:
              print(f"Failed to parse installer JSON from {log_path}: {ex}", file=sys.stderr)
              sys.exit(1)

          install_path = payload.get("InstallPath")
          if payload.get("Success") and install_path:
              print(install_path, end="")
          else:
              print(payload.get("Message") or "ngspice installation failed", file=sys.stderr)
              sys.exit(1)
          PY
          )"
          echo "$(dirname "$install_path")" >> "$GITHUB_PATH"

      - name: Install MSYS2 build deps (windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          path-type: inherit
          install: >-
            autoconf
            automake
            bison
            flex
            gawk
            libtool
            make
            mingw-w64-x86_64-gcc

      - name: Install ngspice via CLI (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build
          install_log="build/ngspice-install-windows.log"
          rm -f "$install_log"
          set +e
          ./tools/cli/bin/Release/$DOTNET_TFM/Cascode.Cli.exe install ngspice --from-source --json >"$install_log" 2>&1
          install_exit=$?
          set -e
          cat "$install_log"
          if [ "$install_exit" -ne 0 ]; then
            exit "$install_exit"
          fi
          install_path="$(python - "$install_log" <<'PY'
          import json
          import pathlib
          import sys

          log_path = pathlib.Path(sys.argv[1])
          line = next((line for line in reversed(log_path.read_text(encoding="utf-8").splitlines()) if line.strip()), "")

          try:
              payload = json.loads(line)
          except json.JSONDecodeError as ex:
              print(f"Failed to parse installer JSON from {log_path}: {ex}", file=sys.stderr)
              sys.exit(1)

          install_path = payload.get("InstallPath")
          if payload.get("Success") and install_path:
              print(install_path, end="")
          else:
              print(payload.get("Message") or "ngspice installation failed", file=sys.stderr)
              sys.exit(1)
          PY
          )"
          printf 'NGSPICE_INSTALL_PATH=%s\n' "$install_path" >> "$GITHUB_ENV"
          python - "$install_path" <<'PY'
          import os
          import sys
          from pathlib import PureWindowsPath

          bin_dir = str(PureWindowsPath(sys.argv[1]).parent)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
              handle.write(bin_dir + "\n")
          PY

      - name: Verify ngspice installation
        if: runner.os != 'Windows'
        run: ngspice --version

      - name: Verify ngspice installation (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path $env:NGSPICE_INSTALL_PATH)) {
            throw "ngspice binary missing: $env:NGSPICE_INSTALL_PATH"
          }
          Write-Host $env:NGSPICE_INSTALL_PATH

      - name: Verify ngspice PSS support (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          deck="$(mktemp)"
          cat > "$deck" <<'EOF'
          * ngspice pss smoke
          V1 in 0 0
          R1 in 0 1k
          .control
          pss 1MEG 1u in 64 3 20 1e-3
          quit
          .endc
          .end
          EOF
          output="$(ngspice -b "$deck" 2>&1)"
          printf '%s\n' "$output"
          [[ "$output" == *"Periodic Steady State Analysis Started"* ]]

      - name: Verify ngspice PSS support (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deck = Join-Path $env:RUNNER_TEMP "ngspice-pss-smoke.cir"
          @'
          * ngspice pss smoke
          V1 in 0 0
          R1 in 0 1k
          .control
          pss 1MEG 1u in 64 3 20 1e-3
          quit
          .endc
          .end
          '@ | Set-Content -Path $deck
          $output = & $env:NGSPICE_INSTALL_PATH -b $deck 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'Periodic Steady State Analysis Started') {
            throw 'ngspice installation is missing PSS support'
          }

      - name: Build (Release)
        run: dotnet build Cascode.sln --configuration Release --nologo --no-restore

      - name: Restore Tools
        run: dotnet tool restore

      - name: Check Markdown Links
        run: python3 scripts/check_markdown_links.py

      - name: Format Check
        run: dotnet csharpier check .

      - name: Test with Coverage
        shell: bash -el {0}
        run: dotnet test Cascode.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml

  native_node_test:
    name: native node test (${{ matrix.rid }})
    needs: native_node_path_filter
    if: github.event_name != 'pull_request' || needs.native_node_path_filter.outputs.run_native_node == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: Cascode.Native.so
          - os: macos-15-intel
            rid: osx-x64
            lib_name: Cascode.Native.dylib
          - os: macos-15
            rid: osx-arm64
            lib_name: Cascode.Native.dylib
          - os: windows-latest
            rid: win-x64
            lib_name: Cascode.Native.dll
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.103'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            editors/node/package-lock.json

      - name: Publish Cascode.Native
        run: >
          dotnet publish tools/native/Cascode.Native/Cascode.Native.csproj
          --configuration Release
          -r ${{ matrix.rid }}
          -p:PublishAot=true
          -p:EnableAotAnalyzer=false
          -p:EnableTrimAnalyzer=false
          -p:NoWarn=IL2026%3BIL3050%3BCS3021
          -o build/native/${{ matrix.rid }}

      - name: Install node deps
        run: npm install --omit=optional
        working-directory: editors/node

      - name: Build node addon
        run: npm run build
        working-directory: editors/node

      - name: Test node package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export CASCODE_NATIVE_LIB="$GITHUB_WORKSPACE/build/native/${{ matrix.rid }}/${{ matrix.lib_name }}"
          npm test
        working-directory: editors/node

      - name: Test node package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CASCODE_NATIVE_LIB = "$env:GITHUB_WORKSPACE\build\native\${{ matrix.rid }}\${{ matrix.lib_name }}"
          npm test
        working-directory: editors/node
