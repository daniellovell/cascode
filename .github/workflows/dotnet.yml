name: dotnet-ci

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'build/**'
  pull_request:
    paths-ignore:
      - 'build/**'

jobs:
  build_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        dotnet: ['10.0.102']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Setup micromamba
        if: runner.os != 'Windows'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: tests/simulation/environment.yml
          environment-name: cascode-sim
          cache-environment: true

      - name: Verify ngspice installation
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: ngspice --version

      - name: Restore (locked)
        run: dotnet restore Cascode.sln --locked-mode

      - name: Clean (Release)
        run: dotnet clean Cascode.sln --configuration Release

      - name: Build CLI (Release)
        run: dotnet build tools/cli/Cascode.Cli.csproj --configuration Release --nologo --no-restore

      - name: Build (Release)
        run: dotnet build Cascode.sln --configuration Release --nologo --no-restore

      - name: Restore Tools
        run: dotnet tool restore

      - name: Format Check
        run: dotnet csharpier check .

      - name: Test with Coverage
        shell: bash -el {0}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            dotnet test Cascode.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage" --filter "Category!=Simulation"
          else
            dotnet test Cascode.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage"
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml

  native_node_test:
    name: native node test (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: Cascode.Native.so
          - os: macos-15-intel
            rid: osx-x64
            lib_name: Cascode.Native.dylib
          - os: macos-15
            rid: osx-arm64
            lib_name: Cascode.Native.dylib
          - os: windows-latest
            rid: win-x64
            lib_name: Cascode.Native.dll
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.102'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            editors/node/package-lock.json

      - name: Publish Cascode.Native
        run: >
          dotnet publish tools/native/Cascode.Native/Cascode.Native.csproj
          --configuration Release
          -r ${{ matrix.rid }}
          -p:PublishAot=true
          -p:EnableAotAnalyzer=false
          -p:EnableTrimAnalyzer=false
          -p:NoWarn=IL2026%3BIL3050%3BCS3021
          -o build/native/${{ matrix.rid }}

      - name: Install node deps
        run: npm install --omit=optional
        working-directory: editors/node

      - name: Build node addon
        run: npm run build
        working-directory: editors/node

      - name: Test node package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export CASCODE_NATIVE_LIB="$GITHUB_WORKSPACE/build/native/${{ matrix.rid }}/${{ matrix.lib_name }}"
          npm test
        working-directory: editors/node

      - name: Test node package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CASCODE_NATIVE_LIB = "$env:GITHUB_WORKSPACE\build\native\${{ matrix.rid }}\${{ matrix.lib_name }}"
          npm test
        working-directory: editors/node
