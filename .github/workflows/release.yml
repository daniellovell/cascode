name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version-check:
    name: verify versions match tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify repo versions match tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG"

          # Verify npm wrapper version matches tag
          NPM_VER="$(python3 -c "
          import json
          with open('tools/npm/cascode-cli/package.json', 'r', encoding='utf-8') as f:
              print(json.load(f)['version'])
          ")"
          echo "npm version: $NPM_VER"
          if [[ "$NPM_VER" != "$TAG" ]]; then
            echo "ERROR: tools/npm/cascode-cli/package.json version ($NPM_VER) does not match tag ($TAG)" >&2
            exit 1
          fi

          # Verify native npm package version matches tag
          NATIVE_NPM_VER="$(python3 -c "
          import json
          with open('editors/node/package.json', 'r', encoding='utf-8') as f:
              print(json.load(f)['version'])
          ")"
          echo "native npm version: $NATIVE_NPM_VER"
          if [[ "$NATIVE_NPM_VER" != "$TAG" ]]; then
            echo "ERROR: editors/node/package.json version ($NATIVE_NPM_VER) does not match tag ($TAG)" >&2
            exit 1
          fi

          # Verify native platform package template versions match tag
          TAG_VALUE="$TAG" python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          tag = os.environ["TAG_VALUE"]
          templates = sorted(pathlib.Path("editors/node/platform-packages").glob("*/package.json"))
          if not templates:
            print("ERROR: no platform package templates found under editors/node/platform-packages", file=sys.stderr)
            sys.exit(1)

          for pkg_path in templates:
            with pkg_path.open("r", encoding="utf-8") as f:
              pkg = json.load(f)
            version = pkg.get("version", "")
            name = pkg.get("name", str(pkg_path))
            print(f"platform package {name} version: {version}")
            if version != tag:
              print(
                f"ERROR: {pkg_path} version ({version}) does not match tag ({tag})",
                file=sys.stderr,
              )
              sys.exit(1)
          PY

          # Verify Directory.Build.props CascodeVersion matches tag
          PROPS_VER="$(python3 -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('Directory.Build.props').getroot()
          ns = {'msb': root.tag.split('}')[0].strip('{')} if root.tag.startswith('{') else {}
          def find_text(tag):
              if ns:
                  el = root.find(f\".//msb:{tag}\", ns)
              else:
                  el = root.find(f\".//{tag}\")
              return (el.text or '').strip() if el is not None else ''
          print(find_text('CascodeVersion'))
          ")"
          echo "CascodeVersion: $PROPS_VER"
          if [[ "$PROPS_VER" != "$TAG" ]]; then
            echo "ERROR: Directory.Build.props CascodeVersion ($PROPS_VER) does not match tag ($TAG)" >&2
            exit 1
          fi

  build:
    name: build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: set version from tag
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: publish
        run: |
          dotnet publish tools/cli/Cascode.Cli.csproj -c Release -r ${{ matrix.rid }} -p:Version=${{ env.TAG }} -p:PublishSingleFile=true -p:SelfContained=true -p:PublishTrimmed=false -o build/out/${{ matrix.rid }}
      - name: normalize binary name (unix)
        if: startsWith(matrix.rid, 'linux-') || startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          set -euo pipefail
          cd build/out/${{ matrix.rid }}
          if [[ -f Cascode.Cli ]]; then mv Cascode.Cli cascode; fi
          if [[ -f cascode ]]; then chmod +x cascode; fi
      - name: normalize binary name (windows)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = "build/out/${{ matrix.rid }}"
          if (Test-Path "$p/Cascode.Cli.exe") { Rename-Item "$p/Cascode.Cli.exe" "cascode.exe" -Force }
      - name: archive (unix)
        if: startsWith(matrix.rid, 'linux-') || startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          cd build/out/${{ matrix.rid }}
          cp ../../../LICENSE .
          tar -czf ../../cascode-${{ matrix.rid }}.tar.gz *
      - name: archive (windows)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location "build/out/${{ matrix.rid }}"
          Copy-Item ../../../LICENSE .
          Compress-Archive -Path * -DestinationPath ../../cascode-${{ matrix.rid }}.zip -Force
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: cascode-${{ matrix.rid }}
          path: build/cascode-${{ matrix.rid }}.*

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cascode-*
          path: dist
          merge-multiple: true
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC trusted publishing
      contents: read
    defaults:
      run:
        working-directory: tools/npm/cascode-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: ensure npm 11.5.1+ for trusted publishing
        run: npm install -g npm@latest
      - name: set version from tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          node -e "let p=require('./package.json'); p.version='${TAG}'; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
      - run: npm install --ignore-scripts
      - name: publish npm (prerelease)
        if: contains(github.ref_name, '-')
        run: npm publish --access public --tag next
      - name: publish npm (latest)
        if: ${{ !contains(github.ref_name, '-') }}
        run: npm publish --access public

  npm-publish-js-platforms:
    needs: github-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: Cascode.Native.so
            template: cascode-js-linux-x64
            package_name: "@cascode/cascode-js-linux-x64"
          - os: windows-latest
            rid: win-x64
            lib_name: Cascode.Native.dll
            template: cascode-js-win32-x64
            package_name: "@cascode/cascode-js-win32-x64"
          - os: macos-15-intel
            rid: osx-x64
            lib_name: Cascode.Native.dylib
            template: cascode-js-darwin-x64
            package_name: "@cascode/cascode-js-darwin-x64"
          - os: macos-latest
            rid: osx-arm64
            lib_name: Cascode.Native.dylib
            template: cascode-js-darwin-arm64
            package_name: "@cascode/cascode-js-darwin-arm64"
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: ensure npm 11.5.1+ for trusted publishing
        run: npm install -g npm@latest
      - name: publish native library
        run: >
          dotnet publish tools/native/Cascode.Native/Cascode.Native.csproj
          --configuration Release
          -r ${{ matrix.rid }}
          -p:PublishAot=true
          -p:EnableAotAnalyzer=false
          -p:EnableTrimAnalyzer=false
          -p:NoWarn=IL2026%3BIL3050%3BCS3021
          -o build/native/${{ matrix.rid }}
      - name: install node deps
        run: npm ci --omit=optional
        working-directory: editors/node
      - name: build addon
        run: npm run build
        working-directory: editors/node
      - name: stage platform package
        run: >
          node ./scripts/stage-platform-package.mjs
          --package="${{ matrix.package_name }}"
          --rid="${{ matrix.rid }}"
          --lib="${{ matrix.lib_name }}"
          --version="${{ github.ref_name }}"
          --out="./.dist/${{ matrix.template }}"
        working-directory: editors/node
      - name: publish platform npm (prerelease)
        if: contains(github.ref_name, '-')
        run: |
          npm publish ./editors/node/.dist/${{ matrix.template }} --access public --tag next
      - name: publish platform npm (latest)
        if: ${{ !contains(github.ref_name, '-') }}
        run: npm publish ./editors/node/.dist/${{ matrix.template }} --access public

  npm-publish-js:
    needs: [github-release, npm-publish-js-platforms]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: editors/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: ensure npm 11.5.1+ for trusted publishing
        run: npm install -g npm@latest
      - name: set version from tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          node -e "const fs=require('fs'); const p=require('./package.json'); const v='${TAG}'; p.version=v; for (const key of Object.keys(p.optionalDependencies ?? {})) p.optionalDependencies[key]=v; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"
      - name: publish linux native library for integration test
        run: >
          dotnet publish ../../tools/native/Cascode.Native/Cascode.Native.csproj
          --configuration Release
          -r linux-x64
          -p:PublishAot=true
          -p:EnableAotAnalyzer=false
          -p:EnableTrimAnalyzer=false
          -p:NoWarn=IL2026%3BIL3050%3BCS3021
          -o ../../build/native/linux-x64
      - run: npm ci --omit=optional
      - run: npm run build
      - name: test native npm package
        shell: bash
        run: |
          export CASCODE_NATIVE_LIB="$GITHUB_WORKSPACE/build/native/linux-x64/Cascode.Native.so"
          npm test
      - name: publish npm (prerelease)
        if: contains(github.ref_name, '-')
        run: npm publish --access public --tag next
      - name: publish npm (latest)
        if: ${{ !contains(github.ref_name, '-') }}
        run: npm publish --access public

  nuget-publish:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: set version from tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          dotnet pack tools/cli/Cascode.Cli.csproj -c Release -p:Version=$TAG -p:PackageVersion=$TAG -o build/nuget
      - name: publish to nuget
        run: dotnet nuget push build/nuget/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key $NUGET_API_KEY
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
