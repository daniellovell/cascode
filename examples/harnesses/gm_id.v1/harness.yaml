id: gm_id.v1
version: 1.0.0
description: DC sweep of VGS at fixed VDS/VSB; exports VGS, VD, ID, and derives gm/Id

backends:
  - spectre
  - ngspice

params:
  vds:   { type: number,  default: 0.9,    desc: 'Drain bias (V)' }
  vsb:   { type: number,  default: 0.0,    desc: 'Body bias (V)' }
  start: { type: number,  default: 0.0,    desc: 'VGS start (V)' }
  stop:  { type: number,  default: 1.2,    desc: 'VGS stop (V)' }
  step:  { type: number,  default: 0.01,   desc: 'VGS step (V)' }
  w_m:   { type: number,  default: 1.0e-6, desc: 'Width (m)' }
  l_m:   { type: number,  default: 1.8e-7, desc: 'Length (m)' }
  mult:  { type: integer, default: 1,      desc: 'Multiplier' }
  nf:    { type: integer, default: 1,      desc: 'Fingers' }
  drain_bias_mode: { type: enum, default: fixed, choices: [ fixed, scaled ], desc: 'Drain bias mode: fixed VDS or alpha*VGS' }
  drain_alpha:     { type: number, default: 0.5,  desc: 'If drain_bias_mode=scaled, use VDS = alpha * VGS' }
  inst_name:       { type: string, default: NM0,  desc: 'Instance name for the DUT' }
  as:   { type: number, default: 2.80e-13, desc: 'Source area' }
  ad:   { type: number, default: 2.80e-13, desc: 'Drain area' }
  ps:   { type: number, default: 4.28e-6,  desc: 'Source perimeter' }
  pd:   { type: number, default: 4.28e-6,  desc: 'Drain perimeter' }
  nrd:  { type: number, default: 70e-3,    desc: 'Drain sheet res (Ohm)' }
  nrs:  { type: number, default: 70e-3,    desc: 'Source sheet res (Ohm)' }
  sa:   { type: number, default: 1.40e-7,  desc: 'SA' }
  sb:   { type: number, default: 1.40e-7,  desc: 'SB' }
  sd:   { type: number, default: 1.60e-7,  desc: 'SD' }
  sca:  { type: number, default: 5.699756e-2, desc: 'SCA' }
  scb:  { type: number, default: 5.691e-2, desc: 'SCB' }
  scc:  { type: number, default: 6.95e-3,  desc: 'SCC' }

vectors:
  # Always export these columns on both backends; derived metrics computed later.
  columns: [ vgs, vd, id ]
  # Spectre-only extras (if available): gm, gds, cgs, cgd, vth
  optional: [ gm, gds, cgs, cgd, vth ]

templates:
  spectre: netlist.scs.tpl
  ngspice: netlist.cir.tpl
