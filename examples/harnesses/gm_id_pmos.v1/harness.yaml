id: gm_id_pmos.v1
version: 1.0.0
description: PMOS DC sweep of VSG with optional scaled drain bias; exports VSG, VD, ID, and derives gm/Id

backends:
  - spectre

params:
  vdd:   { type: number,  default: 1.0,    desc: "Supply voltage (V)" }
  vsd:   { type: number,  default: 0.9,    desc: "Drain bias (VSD, V)" }
  drain_bias_mode: { type: enum, default: fixed, choices: [ fixed, scaled ], desc: "Drain bias mode: fixed VSD or alpha*VSG" }
  drain_alpha:     { type: number, default: 0.5,  desc: "If drain_bias_mode=scaled, VSD = alpha * VSG" }
  start: { type: number, default: 0.0, desc: "VSG start (V)" }
  stop:  { type: number, default: 1.2, desc: "VSG stop (V)" }
  step:  { type: number, default: 0.01, desc: "VSG step (V)" }
  w_m:   { type: number,  default: 2.0e-6, desc: "Width (m)" }
  l_m:   { type: number,  default: 4.5e-8, desc: "Length (m)" }
  mult:  { type: integer, default: 1, desc: "Multiplier" }
  nf:    { type: integer, default: 1, desc: "Fingers" }
  inst_name: { type: string, default: PM0, desc: "Instance name for the DUT" }
  as:   { type: number, default: 2.80e-13, desc: "Source area" }
  ad:   { type: number, default: 2.80e-13, desc: "Drain area" }
  ps:   { type: number, default: 4.28e-6,  desc: "Source perimeter" }
  pd:   { type: number, default: 4.28e-6,  desc: "Drain perimeter" }
  nrd:  { type: number, default: 70e-3,    desc: "Drain sheet res (Ohm)" }
  nrs:  { type: number, default: 70e-3,    desc: "Source sheet res (Ohm)" }
  sa:   { type: number, default: 1.40e-7,  desc: "SA" }
  sb:   { type: number, default: 1.40e-7,  desc: "SB" }
  sd:   { type: number, default: 1.60e-7,  desc: "SD" }
  sca:  { type: number, default: 5.699756e-2, desc: "SCA" }
  scb:  { type: number, default: 5.691e-2, desc: "SCB" }
  scc:  { type: number, default: 6.95e-3,  desc: "SCC" }

vectors:
  columns: [ vsg, vd, id ]
  optional: [ gm, gds, cgs, cgd, vth ]

templates:
  spectre: netlist.scs.tpl
